[package]
name = "maintenance_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The runtime half of maintenance_macros: the code table, sensitivity levels as a big-bad-bool word, test thresholds, the timing report, the registry file, and the sensitivity checker."
readme = "../../README.md"
keywords = ["maintenance", "testing", "sensitivity", "registry", "proc-macro"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# the attribute readers the macros and the checker share (simple_impl_attr_kit, syn with full items)
attrs = ["dep:simple_impl_attr_kit", "syn/full", "syn/extra-traits", "syn/visit"]
# the checker and the two command-line tools: sensitivity, timed_test
check = ["attrs", "dep:klepto", "proc-macro2/span-locations"]

[dependencies]
liaise_proc_macro = { workspace = true }
big-bad-bool = { workspace = true }
syn = { version = "2", default-features = false, features = ["parsing", "printing", "proc-macro", "derive", "clone-impls"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
inventory = { workspace = true }
simple_impl_attr_kit = { workspace = true, optional = true }
klepto = { workspace = true, optional = true }

[[bin]]
name = "sensitivity"
path = "src/bin/sensitivity.rs"
required-features = ["check"]

[[bin]]
name = "timed_test"
path = "src/bin/timed_test.rs"
required-features = ["check"]
