[package]
name = "maintenance_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "What maintenance and maintenance_macros both read: the code table, sensitivity levels as a big-bad-bool word, thresholds in time_kit's words, maintenance.toml, and every attribute's reader."
readme = "../../README.md"
keywords = ["maintenance", "testing", "sensitivity", "attributes", "diagnostics"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# the attribute readers the macros and the checks share (simple_impl_attr_kit, syn with full items)
attrs = ["dep:simple_impl_attr_kit", "syn/full", "syn/extra-traits", "syn/visit"]

[dependencies]
liaise_proc_macro = { workspace = true }
big-bad-bool = { workspace = true }
syn = { version = "2", default-features = false, features = ["parsing", "printing", "proc-macro", "derive", "clone-impls"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
simple_impl_attr_kit = { workspace = true, optional = true }
