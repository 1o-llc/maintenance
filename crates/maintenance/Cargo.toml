[package]
name = "maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Keeping a codebase: #[sensitivity], #[timed_test], #[owner], #[requires_review], #[deprecated_after], #[mechanism], #[boundary], #[supersedes], #[reads_env], #[golden] and #[wire_writer], the registry they record into, and the workspace checks that read them through klepto."
readme = "../../README.md"
keywords = ["maintenance", "testing", "sensitivity", "registry", "static-analysis"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# the workspace checks, read through klepto: check::sensitivity, ::mechanism, ::boundary, ::supersedes, ::reads_env, ::golden
check = ["maintenance_core/attrs", "dep:liaise_proc_macro", "dep:klepto", "dep:globset", "dep:walkdir", "dep:syn", "proc-macro2/span-locations"]
# the checks and the timing report declared as xccute lines: `maintenance check <which> ...`, `maintenance timed report <dir>`
runner = ["check", "dep:simple_impl_derive", "dep:xccute_contract", "dep:xccute_runtime"]
# the `maintenance` program that runs those lines
bin = ["runner"]

[dependencies]
maintenance_core = { workspace = true }
maintenance_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
inventory = { workspace = true }
proc-macro2 = { workspace = true }
liaise_proc_macro = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
klepto = { workspace = true, optional = true }
globset = { version = "0.4", optional = true }
walkdir = { version = "2", optional = true }
toml = { workspace = true }
simple_impl_derive = { workspace = true, optional = true }
xccute_contract = { workspace = true, optional = true }
xccute_runtime = { workspace = true, optional = true }

[dev-dependencies]
trybuild = { workspace = true }
big-bad-bool = { workspace = true }

[[bin]]
name = "maintenance"
path = "src/bin/maintenance.rs"
required-features = ["bin"]

[[example]]
name = "check"
required-features = ["check"]

[[test]]
name = "example_workspace"
required-features = ["check"]

[[test]]
name = "scan_problems"
required-features = ["check"]
