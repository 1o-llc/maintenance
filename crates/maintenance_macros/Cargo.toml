[package]
name = "maintenance_macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The attribute macros of maintenance (use them through the maintenance crate): #[sensitivity], #[timed_test], #[owner], #[requires_review], #[deprecated_after], #[mechanism], #[boundary], #[supersedes], #[reads_env], #[golden], #[wire_writer], sensitivity_levels!, boundary_here!."
readme = "../../README.md"
keywords = ["proc-macro", "testing", "maintenance", "sensitivity", "attributes"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::testing"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
maintenance_core = { workspace = true, features = ["attrs"] }
liaise_proc_macro = { workspace = true }
simple_impl_attr_kit = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
