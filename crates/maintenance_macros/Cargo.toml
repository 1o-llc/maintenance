[package]
name = "maintenance_macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Attributes for keeping a codebase: #[sensitivity(level)], #[timed_test(max = \"2s\")], #[owner(\"team\")], #[requires_review], #[deprecated_after(\"YYYY-MM-DD\")], and sensitivity_levels!."
readme = "../../README.md"
keywords = ["proc-macro", "testing", "maintenance", "sensitivity", "attributes"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::testing"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
maintenance_core = { workspace = true, features = ["attrs"] }
liaise_proc_macro = { workspace = true }
simple_impl_attr_kit = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
big-bad-bool = { workspace = true }
