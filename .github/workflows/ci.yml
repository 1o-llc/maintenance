# Tests every push and pull request on the newest Rust and on the oldest one
# this workspace supports (rust-version in Cargo.toml). On main, once the tests
# pass, publishes each crate whose Cargo.toml version is not on crates.io yet,
# in dependency order. Publishing uses crates.io trusted publishing: no stored token.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the workspace's crates, in the order they depend on each other
  CRATES: maintenance_core maintenance_macros maintenance

jobs:
  test:
    name: test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test
        if: matrix.rust == 'stable'
        run: cargo test --workspace --all-features
      - name: Build and test on the oldest supported Rust
        # two trybuild cases carry the compiler's own wording (E0080, E0432), which changed after 1.85;
        # the codes in every other case are the same on both
        if: matrix.rust != 'stable'
        run: cargo test --workspace --all-features -- --skip ui_compile_fail_matrix
      - name: The example workspace's own tests
        run: cd examples/workspace && cargo test
      - name: Every check on the example workspace (it is written to fail, exit 1)
        run: |
          status=0
          cargo run -p maintenance --features check --example check -- examples/workspace || status=$?
          [ "$status" = 1 ] || { echo "expected exit 1 (findings), got $status"; exit 1; }

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Which crates are not on crates.io at this version?
        id: check
        run: |
          new=""
          for name in $CRATES; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} CI" "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already on crates.io; nothing to publish." ;;
              404) echo "$name $version is new; publishing."; new="$new $name" ;;
              *) echo "crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has an entry for this version
        if: steps.check.outputs.new != ''
        run: |
          # every release says why, with links to the lines: no dated entry, no publish
          # ("## 0.1.0 (unreleased)" holds a version back until its entry has its date)
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "maintenance") | .version')
          grep -qE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version (YYYY-MM-DD)' entry; write it first"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.new != ''
        id: auth
      - name: Publish
        if: steps.check.outputs.new != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short; echo "uncommitted changes"; exit 1
          fi
          # in dependency order; a crate published a moment ago may not be in the index yet, so wait for it and retry
          for name in ${{ steps.check.outputs.new }}; do
            for attempt in $(seq 1 30); do
              log="$RUNNER_TEMP/publish-$name.log"
              if cargo publish -p "$name" 2> "$log"; then cat "$log"; continue 2; fi
              cat "$log"
              grep -qE 'no matching package named|candidate versions found which didn.t match' "$log" || exit 1
              echo "a dependency is not on crates.io yet; waiting 30s (attempt $attempt of 30)"
              sleep 30
            done
            exit 1
          done
